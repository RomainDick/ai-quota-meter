name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh
      - name: Archive
        run: |
          ./scripts/make-dmg.sh
          mv build/AIQuotaMeter.dmg AIQuotaMeter.dmg
          ditto -c -k --keepParent build/AIQuotaMeter.app AIQuotaMeter.zip
          shasum -a 256 AIQuotaMeter.zip > AIQuotaMeter.zip.sha256
          shasum -a 256 AIQuotaMeter.dmg > AIQuotaMeter.dmg.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AIQuotaMeter.dmg AIQuotaMeter.dmg.sha256 AIQuotaMeter.zip AIQuotaMeter.zip.sha256 --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
