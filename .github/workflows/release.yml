name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh
      - name: Archive
        run: |
          ditto -c -k --keepParent build/AIUsageBar.app AIUsageBar.zip
          shasum -a 256 AIUsageBar.zip > AIUsageBar.zip.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AIUsageBar.zip AIUsageBar.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
